<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Окно в другой мир</title>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body class="auth-page">
  <main class="login-card">
    <a class="brand dark" href="/"><span>ОМ</span> Окно в другой мир</a>
    <p class="eyebrow">Закрытая зона</p>
    <h1>Вход в панель</h1>
    {% if not configured %}<div class="notice error">Сервер не настроен: задайте переменные <code>AUTOPOSTER_WEB_USERNAME</code> и <code>AUTOPOSTER_WEB_PASSWORD</code>.</div>{% endif %}
    {% if error %}<div class="notice error">{{ error }}</div>{% endif %}
    <form method="post" action="/login" autocomplete="off">
      <label>Логин администратора<input type="text" name="username" required autofocus autocomplete="off" autocapitalize="none" spellcheck="false"></label>
      <label>Пароль администратора<input type="password" name="password" required autocomplete="off"></label>
      <button class="button primary full" type="submit">Войти</button>
    </form>
  </main>
</body>
</html>
